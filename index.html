<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Turnos</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
      color: #222;
    }

    #turno {
      font-size: 84px;
      font-weight: bold;
      margin: 30px 0;
      color: #005fcc;
    }

    .fila {
      font-size: 20px;
      color: #555;
      margin-bottom: 25px;
    }

    .grupo {
      margin-bottom: 20px;
    }

    button {
      font-size: 18px;
      padding: 14px 22px;
      margin: 6px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #0078d4;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    .secundario {
      background: #6c757d;
    }

    .mensaje {
      background: #198754;
    }

    .velocidad {
      background: #adb5bd;
      color: #000;
    }

    .velocidad.activa {
      background: #0d6efd;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Control de Turnos</h1>

  <div id="turno">0</div>
  <div class="fila">Cajas</div>

  <div class="grupo">
    <button onclick="anterior()">◀ Anterior</button>
    <button onclick="siguiente()">Siguiente ▶</button>
  </div>

  <div class="grupo">
    <button class="velocidad activa" id="vel1" onclick="setVelocidad(1)">X1</button>
    <button class="velocidad" id="vel3" onclick="setVelocidad(3)">X3</button>
  </div>

  <div class="grupo">
    <button onclick="llamarTurno()">🔊 Llamar</button>
    <button class="secundario" onclick="repetirTurno()">🔁 Repetir</button>
    <button class="mensaje" onclick="mensajePublico()">📢 Mensaje público</button>
    <button class="secundario" onclick="iniciarEnCero()">⏮️ Iniciar en 0</button>
  </div>

<script>
  let turnoActual = Number(localStorage.getItem("turnoActual")) || 0;
  let velocidad = 1;
  let bloqueado = false;
  const LIMITE_TURNO = 2000;

  function mostrarTurno() {
    document.getElementById("turno").innerText = turnoActual;
    localStorage.setItem("turnoActual", turnoActual);
  }

  function ejecutarSeguro(accion) {
    if (bloqueado) return;
    bloqueado = true;
    accion();
    setTimeout(() => bloqueado = false, 250);
  }

  function siguiente() {
    ejecutarSeguro(() => {
      turnoActual = Math.min(LIMITE_TURNO, turnoActual + velocidad);
      mostrarTurno();
    });
  }

  function anterior() {
    ejecutarSeguro(() => {
      turnoActual = Math.max(0, turnoActual - velocidad);
      mostrarTurno();
    });
  }

  function setVelocidad(v) {
    velocidad = v;
    document.getElementById("vel1").classList.remove("activa");
    document.getElementById("vel3").classList.remove("activa");
    document.getElementById("vel" + v).classList.add("activa");
  }

  function llamarTurno() {
    const texto = `Cajas, ${numeroATexto(turnoActual)}, pasar a fila.`;
    hablar(texto);
  }

  function repetirTurno() {
    llamarTurno();
  }

  function mensajePublico() {
    const texto = `Contribuyente, si tu turno no es para pasar a cajas, por favor poner atención a la pantalla en la parte superior, para verificar en qué turno va, y en qué módulo te atenderán. Por tu atención, gracias.`;
    hablar(texto);
  }

  function iniciarEnCero() {
    const confirmar = confirm("¿Estás seguro que deseas reiniciar el contador?");
    if (!confirmar) return;

    ejecutarSeguro(() => {
      turnoActual = 0;
      mostrarTurno();
    });
  }

  function hablar(texto) {
    const msg = new SpeechSynthesisUtterance(texto);
    msg.lang = "es-MX";
    speechSynthesis.cancel();
    speechSynthesis.speak(msg);
  }

  function numeroATexto(n) {
    return new Intl.NumberFormat("es-MX").format(n);
  }

  mostrarTurno();
</script>

</body>
</html>
